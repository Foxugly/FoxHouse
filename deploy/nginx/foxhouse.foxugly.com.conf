# foxhouse.foxugly.com — installé par le déploiement depuis le miroir de root
# (/etc/nginx/sites-available/foxhouse.foxugly.com, foxhouse-deploy-privileged.sh),
# vérifié par `nginx -t` avant rechargement. Modifier ce fichier dans le dépôt,
# jamais sur la machine.
#
# Le frontend Angular est servi en statique par nginx ; /api/, /health/ et
# /admin/ vont à gunicorn (127.0.0.1:8013) ; /static/ (fichiers de l'admin) est
# lu sur le disque. Tout est sur le même domaine : cookie de session et CSRF
# same-origin.

# --- Contexte http (ce fichier y est inclus via sites-enabled) ------------------
# Noms préfixés `foxhouse_` : zones et variables sont globales à nginx.

# POST de l'API (créer une partie, jouer un coup) : la machine joue dans la
# requête. 5 requêtes/s par IP, rafale de 20 : bien au-dessus d'un humain qui
# joue. Les GET ne sont pas limités (clé vide = pas de limite).
map $request_method $foxhouse_cle_post {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $foxhouse_cle_post zone=foxhouse_api_post:10m rate=5r/s;
# /admin/login/, la seule page à mot de passe.
limit_req_zone $binary_remote_addr zone=foxhouse_admin_login:10m rate=10r/m;

# CSP des documents du frontend (index.html et routes de la SPA). Build AOT, API
# same-origin : aucun script en ligne (inlineCritical désactivé dans angular.json,
# donc pas de `onload` en ligne non plus) ; styles en ligne permis (liaisons de
# style d'Angular). connect-src : Sentry (ingest de.sentry.io).
# Les réponses de Django (/admin/, /api/, /health/) ne la reçoivent pas : Django
# pose sa propre CSP (SECURE_CSP, avec nonce, config/settings.py) et ses en-têtes
# de sécurité (HSTS, nosniff, X-Frame-Options, Referrer-Policy, COOP).
map $host $foxhouse_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.ingest.de.sentry.io";
}

upstream foxhouse_app {
    server 127.0.0.1:8013;
}

server {
    listen 80;
    listen [::]:80;
    server_name foxhouse.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 sur la machine : forme combinée `listen … ssl http2`
    # (`http2 on;` y est refusé, OPERATIONS.md §3.11).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foxhouse.foxugly.com;

    # Certificat joker de la flotte (*.foxugly.com), renouvelé tout seul (§3.6).
    ssl_certificate /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/foxhouse.access.log;
    error_log /var/log/nginx/foxhouse.error.log;

    client_max_body_size 1M;

    # --- Compression ---
    # Le frontend est pré-compressé en CI (.gz et .br à côté de chaque fichier) :
    # servi tel quel (*_static, aucun CPU). La compression dynamique couvre le JSON
    # de l'API. Modules brotli présents sur la machine (comme foxugly.com).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    root /var/www/django_websites/FoxHouse/frontend/dist/frontend/browser;
    index index.html;

    # En-têtes : add_header ne s'hérite pas dans un location qui en pose
    # (OPERATIONS.md §3.19) — chaque location qui en pose répète tout. Ici, au
    # niveau server, seulement ce que Django n'envoie jamais ; il atteint les
    # locations proxifiées, qui n'en posent pas.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Django ---
    location = /health/ {
        proxy_pass http://foxhouse_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /api/ {
        limit_req zone=foxhouse_api_post burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://foxhouse_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    location = /admin/login/ {
        limit_req zone=foxhouse_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://foxhouse_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://foxhouse_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers statiques de l'admin (collectstatic), lus sur le disque : pas de
    # WhiteNoise. Noms non hachés : cache d'une semaine.
    location ^~ /static/ {
        alias /var/www/django_websites/FoxHouse/backend/staticfiles/;
        expires 7d;
        access_log off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # --- Frontend Angular ---
    # index.html référence les fichiers hachés : jamais en cache (revalidé, ETag → 304).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $foxhouse_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Fichiers hachés par Angular à la racine (main-HASH.js, chunk-HASH.js,
    # styles-HASH.css) et polices sous media/ : immuables, un an.
    location ~ "^/(?:media/)?[^/]+-[A-Za-z0-9]{8,}\.(?:js|css|woff2?|ttf)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    # Images des cartes (public/cartes/), noms non hachés : une semaine.
    location ^~ /cartes/ {
        expires 7d;
        access_log off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Routes de la SPA : un fichier existant, sinon index.html (location ci-dessus).
    location / {
        add_header Content-Security-Policy $foxhouse_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.html;
    }
}

@if (image(); as src) {
  <img class="face" [src]="src" [alt]="alt()" draggable="false" />
  @if (badge(); as b) {
    <span class="badge">{{ b }}</span>
  }
  @if (index(); as i) {
    <span class="index" aria-hidden="true" [class.rouge]="i.rouge">
      <span class="valeur">{{ i.valeur }}</span>
      <span class="enseigne">{{ i.enseigne }}</span>
    </span>
  }
} @else {
  <div class="dos"></div>
}

name: Dependabot auto-merge

# Active la fusion automatique (squash) des PR Dependabot qui ne sont pas une
# majeure. GitHub ne fusionne qu'une fois tous les checks requis de la
# protection de main au vert — ce workflow ne fusionne jamais une PR rouge.
# Les majeures (ignorées en routine dans dependabot.yml ; un correctif de
# sécurité peut en être une) restent ouvertes pour un humain.
#
# La fusion se fait avec DEPENDABOT_AUTOMERGE_TOKEN (PAT à grain fin, rangé en
# secret *Dependabot*) : une fusion faite avec GITHUB_TOKEN ne déclenche pas les
# workflows de push, donc ni la CI ni le déploiement ne tourneraient sur main.
# Sans le secret, le job échoue bruyamment au lieu de ne rien faire.
# Doc de la flotte : OPERATIONS.md §3.20.

on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Fusion automatique (hors majeures)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_AUTOMERGE_TOKEN (secret Dependabot) absent — fusion automatique non activée."
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
